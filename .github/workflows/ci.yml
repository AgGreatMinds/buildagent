# Roda a cada push e pull request: tipos, testes e build precisam passar.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Um push novo no mesmo ramo cancela a rodada antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
